<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react1</title>
  </head>
  <body>
    <!-- 리액트는 SPA(.HTML 1개) 구조이다 -->
     <!-- 리액트는 div안에 js이용해 내용물 넣어주는 구조, 모든 html들은 root에 포함 -->
    <div id="root"></div>
    <!-- 최조로 root에 .innerHTML(특정마크업에 내용물 대입 속성) 해주는 코드가 main.jsx 포함 -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
